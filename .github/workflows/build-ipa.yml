name: Build unsigned IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'ChargerMonitor/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ChargerMonitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project ChargerMonitor.xcodeproj \
            -scheme ChargerMonitor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          rm -rf Payload ChargerMonitor-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ChargerMonitor.app Payload/
          zip -qry ChargerMonitor-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChargerMonitor-unsigned-ipa
          path: ChargerMonitor/ChargerMonitor-unsigned.ipa
          if-no-files-found: error
