<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地八字排盘 · 隐私版</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">命</span>
    <div>
      <h1>本地八字排盘</h1>
      <p class="sub">四柱 · 十神 · 大运流年 · 规则解算</p>
    </div>
  </div>
  <div class="top-actions">
    <span class="privacy-badge" title="所有数据只写入本机 SQLite 文件，排盘在本地完成，不联网">🔒 数据仅存本机</span>
    <button id="btn-settings" class="ghost">AI 设置</button>
  </div>
</header>

<main class="layout">
  <!-- 左栏：输入 -->
  <section class="panel form-panel">
    <h2>出生信息</h2>
    <form id="birth-form">
      <div class="row">
        <label>姓名 / 备注
          <input type="text" name="name" placeholder="如：张三" autocomplete="off">
        </label>
      </div>

      <div class="row two">
        <label>性别
          <select name="gender">
            <option value="1">男</option>
            <option value="0">女</option>
          </select>
        </label>
        <label>历法
          <select name="calendar" id="calendar">
            <option value="solar">公历（阳历）</option>
            <option value="lunar">农历（阴历）</option>
          </select>
        </label>
      </div>

      <div class="row date-grid">
        <label>年<input type="number" name="year" min="1900" max="2100" value="1990" required></label>
        <label>月<input type="number" name="month" min="1" max="12" value="1" required></label>
        <label>日<input type="number" name="day" min="1" max="31" value="1" required></label>
      </div>

      <div class="row date-grid">
        <label>时<input type="number" name="hour" min="0" max="23" value="12" required></label>
        <label>分<input type="number" name="minute" min="0" max="59" value="0" required></label>
        <label id="leap-wrap" class="checkbox-wrap hidden">
          <span>&nbsp;</span>
          <span class="cb"><input type="checkbox" name="is_leap"> 闰月</span>
        </label>
      </div>

      <div class="row">
        <label>出生地经度（可选，用于真太阳时）
          <input type="number" name="longitude" step="0.01" min="-180" max="180"
                 placeholder="如 116.40（北京）" list="city-list" autocomplete="off">
          <datalist id="city-list">
            <option value="116.40">北京</option>
            <option value="121.47">上海</option>
            <option value="113.26">广州</option>
            <option value="114.06">深圳</option>
            <option value="104.07">成都</option>
            <option value="108.95">西安</option>
            <option value="126.63">哈尔滨</option>
            <option value="87.62">乌鲁木齐</option>
            <option value="114.17">香港</option>
            <option value="121.47">台北</option>
          </datalist>
        </label>
      </div>

      <div class="row two">
        <label class="checkbox-wrap"><span class="cb"><input type="checkbox" name="use_true_solar"> 启用真太阳时</span></label>
        <label title="晚子时指出生时间在 23:00–24:00 之间">晚子时(23:00后)日柱
          <select name="sect">
            <option value="2">算当天</option>
            <option value="1">算次日</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button type="submit" class="primary">开始排盘</button>
        <button type="button" id="btn-save" class="ghost">保存档案</button>
      </div>
    </form>

    <div class="profiles">
      <h3>已存档案 <span class="hint">（仅本机）</span></h3>
      <ul id="profile-list"></ul>
    </div>
  </section>

  <!-- 右栏：结果 -->
  <section class="panel result-panel">
    <div id="empty-state" class="empty">
      <p>填写左侧出生信息并点击「开始排盘」。</p>
      <p class="muted">排盘基于节气精确时刻计算，可在填写经度后启用真太阳时。</p>
    </div>
    <div id="result" class="hidden"></div>
  </section>
</main>

<!-- AI 设置弹窗 -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-box">
    <h2>AI 解读设置</h2>
    <p class="muted small">
      默认关闭。开启后，当你点击「AI 解读」时，本机后端才会把你当前这份命盘数据发送到下面配置的接口。
      不开启、不点击，就不会有任何数据离开本机。密钥保存在本机数据库中。
    </p>
    <label class="switch-row">
      <span class="cb"><input type="checkbox" id="ai-enabled"> 启用 AI 解读</span>
    </label>
    <label>接口地址 base_url
      <input type="text" id="ai-base" placeholder="如 https://api.openai.com/v1" autocomplete="off">
    </label>
    <label>API Key
      <input type="password" id="ai-key" placeholder="sk-..." autocomplete="off">
    </label>
    <div class="row two">
      <label>模型 model
        <input type="text" id="ai-model" placeholder="如 gpt-4o-mini" autocomplete="off">
      </label>
      <label>temperature
        <input type="number" id="ai-temp" step="0.1" min="0" max="2" value="0.7">
      </label>
    </div>
    <div class="actions">
      <button id="btn-save-ai" class="primary">保存设置</button>
      <button id="btn-close-ai" class="ghost">关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
